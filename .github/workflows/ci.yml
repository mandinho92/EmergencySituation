name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase (Postgres, Auth, Realtime)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: RLS, invitations and realtime tests
        run: npm run test:integration
      - name: Verify generated types are up to date
        run: |
          npm run db:types
          git diff --exit-code src/lib/supabase/database.types.ts
