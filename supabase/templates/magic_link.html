<!doctype html>
<html lang="pt-PT">
  <body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #0f172a; background: #f8fafc; padding: 24px;">
    <table role="presentation" width="100%" style="max-width: 520px; margin: 0 auto; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 32px;">
      <tr><td>
        <h1 style="font-size: 20px; margin: 0 0 16px;">Entrar no FamilyReady</h1>
        <p style="font-size: 15px; line-height: 1.5;">Use o botão abaixo para entrar na sua conta. O link é válido durante 1 hora e só pode ser usado uma vez.</p>
        <p style="margin: 24px 0;">
          <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="background: #1e3a5f; color: #ffffff; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: 600;">Entrar</a>
        </p>
        <p style="font-size: 14px;">Ou introduza este código na aplicação: <strong style="font-size: 18px; letter-spacing: 2px;">{{ .Token }}</strong></p>
        <p style="font-size: 13px; color: #64748b;">Se não pediu este acesso, pode ignorar este email. Ninguém entra na sua conta sem este link.</p>
      </td></tr>
    </table>
  </body>
</html>
